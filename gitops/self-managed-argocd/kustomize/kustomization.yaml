apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argo-cd-sm
resources:
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.2.3/manifests/install.yaml


patches:
  - patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: default
    target:
      kind: ClusterRoleBinding